<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tournament Bracket</title>
    <style>
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
            text-align: center;
            padding: 8px;
        }
        caption {
            font-weight: bold;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <table>
        <caption>Annual Sports Tournament Bracket</caption>
        <tr>
            <th rowspan="2">Round 1</th>
            <th rowspan="2">Quarterfinals</th>
            <th rowspan="2">Semifinals</th>
            <th rowspan="2">Final</th>
            <th rowspan="2">Winner</th>
        </tr>
        <tr></tr>
        <tr>
            <td>Team A</td>
            <td rowspan="2">Team A</td>
            <td rowspan="4">Team A</td>
            <td rowspan="8">Team A</td>
            <td rowspan="16">Team A</td>
        </tr>
        <tr>
            <td>Team B</td>
        </tr>
        <tr>
            <td>Team C</td>
            <td rowspan="2">Team C</td>
        </tr>
        <tr>
            <td>Team D</td>
        </tr>
        <tr>
            <td>Team E</td>
            <td rowspan="2">Team E</td>
            <td rowspan="4">Team E</td>
        </tr>
        <tr>
            <td>Team F</td>
        </tr>
        <tr>
            <td>Team G</td>
            <td rowspan="2">Team G</td>
        </tr>
        <tr>
            <td>Team H</td>
        </tr>
    </table>
</body>
</html>
